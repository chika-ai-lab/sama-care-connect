<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 64" fill="none">
  <defs>
    <linearGradient id="iconGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FF5F6D"/>
      <stop offset="1" stop-color="#FFC371"/>
    </linearGradient>
  </defs>

  <!-- Icon: rounded square with gradient -->
  <rect width="64" height="64" rx="18" fill="url(#iconGrad)"/>

  <!-- Y letter -->
  <path d="M20 14 L32 33 L44 14 M32 33 L32 50"
        stroke="white" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Confetti dots -->
  <circle cx="74" cy="10" r="3" fill="#FF5F6D" opacity="0.55"/>
  <circle cx="82" cy="4"  r="2" fill="#FFC371" opacity="0.65"/>
  <circle cx="68" cy="4"  r="2" fill="#FF5F6D" opacity="0.45"/>

  <!-- Wordmark -->
  <text x="78" y="46"
        font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
        font-size="36"
        font-weight="900"
        fill="#1A1A2E">Yaay</text>
</svg>
